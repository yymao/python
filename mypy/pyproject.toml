[project]
name = "mypy"
version = "2026.05.12"
requires-python = ">=3.14"
dependencies = [
    "core",
    "adstex>=0.6",
    "beautifulsoup4>=4",
    "fuzzyname>=0.2",
    "lxml>=6",
    "setuptools>=80",
    "sympy>=1.14",
    "twine>=6",
    "torch>=2.11",
    "torchvision>=0.26",
]

[tool.uv.sources]
core = { path = "../core", package = false }
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
